<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AucTech Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>

<script>window.AUCTECH_API_BASE = "https://auctech-vault-backend-1.onrender.com/api";</script>

<!-- Login module (exposes authFetch, logout, etc.) -->
<script src="login.js"></script>

<body>

<!-- ============ LOCK SCREEN (loaded from lockscreen.html) ============ -->
<div id="lockScreenContainer"></div>

<!-- ============ APP ============ -->
<div id="app">

  <!-- topbar -->
  <header class="header">
    <button class="ham-btn" onclick="toggleSidebar()" aria-label="Toggle menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FF5C8A"/><stop offset=".6" stop-color="#DE3163"/><stop offset="1" stop-color="#C02050"/>
        </linearGradient></defs>
        <g fill="none" stroke="url(#bg2)" stroke-linecap="round">
          <path d="M32 14a18 18 0 1 1-18 18" stroke-width="5"/>
          <path d="M32 22a10 10 0 1 1-10 10" stroke-width="5"/>
          <circle cx="32" cy="32" r="4" fill="url(#bg2)" stroke="none"/>
        </g>
      </svg>
      <div class="bn">AucTech<small>Vault</small></div>
    </div>
    <div class="searchwrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="globalSearch" placeholder="Search — client, domain, provider, username…" oninput="doSearch(this.value)">
      <span class="kbd">Ctrl K</span>
    </div>
    <div class="hdr-acts">
      <span class="who" id="whoami"></span>
    </div>
  </header>

  <!-- body: sidebar + page content -->
  <div class="app-body">

    <!-- sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <div class="sb-label">Menu</div>

        <button class="tab on" data-view="dashboard" onclick="go('dashboard')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </button>

         <button class="tab" data-view="clients" onclick="go('clients')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Clients
        </button>

        <button class="tab" data-view="categories" onclick="go('categories')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7"/><circle cx="17" cy="18" r="3"/><path d="m19.5 15.5-1 1"/></svg>
          Categories
        </button>

        <button class="tab" data-view="vault" onclick="go('vault')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Vault
        </button>
       
        <button class="tab" data-view="renewals" id="tab-renewals" onclick="go('renewals')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          Renewals
        </button>

        <button class="tab" data-view="social" id="tab-social" onclick="go('social')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0 1 12 0M16 4a3.5 3.5 0 0 1 0 7M17 14a6 6 0 0 1 4 6"/></svg>
          Social Media
        </button>

        <button class="tab" data-view="settings" onclick="go('settings')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
          Settings
        </button>
      </div>

      <div class="sidebar-foot">
        <button class="btn btn-primary" id="addBtn" onclick="openEdit()">＋ Add</button>
        <button class="sb-logout" onclick="manualLogout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Log out
        </button>
      </div>
    </aside>

    <!-- mobile sidebar overlay -->
    <div class="sb-overlay" id="sbOverlay" onclick="toggleSidebar()"></div>

    <!-- page content -->
    <main class="main" id="main"></main>

  </div><!-- /.app-body -->

  <!-- old tabs nav (hidden, kept for JS compatibility) -->
  <nav class="tabs" aria-hidden="true">
    <button class="tab" data-view="dashboard"></button>
    <button class="tab" data-view="vault"></button>
    <button class="tab" data-view="renewals" id="tab-renewals-ghost"></button>
    <button class="tab" data-view="social"   id="tab-social-ghost"></button>
    <button class="tab" data-view="settings"></button>
  </nav>

</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer"></aside>
<div id="toasts"></div>

<!-- ============ App scripts ============ -->
<script src="js/api.js"></script>
<script src="js/functions.js"></script>
<script src="js/helpers.js"></script>
<script src="js/vault.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/renewals.js"></script>
<script src="js/socialmedia.js"></script>
<script src="js/settings.js"></script>
<script src="js/clients.js"></script>
<script src="js/categories.js"></script>
<script src="js/navigation.js"></script>
<script src="js/role.js"></script>
<script src="js/dataloader.js"></script>
<script src="js/auth.js"></script>
<script>

/* ---------------- shared state ---------------- */
let D        = { creds: [], audit: [], categories: [], clients: [] }; // in-memory only
let view     = 'dashboard';
let filt     = { cat: null, client: null, q: '' };
let userRole = null; // 'main' | 'social' | 'developer' | 'secondary'

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'tmp-' + Date.now() + '-' + Math.random());
const now = () => new Date().toISOString();

/* ---------------- load lockscreen HTML ---------------- */
fetch('lockscreen.html')
  .then(r => r.text())
  .then(html => {
    document.getElementById('lockScreenContainer').innerHTML = html;
    // re-init password toggles after HTML is injected (login.js needs the DOM)
    if (typeof initPasswordToggles === 'function') initPasswordToggles();
    // if a session token exists, try to resume it now that the DOM is ready
    if (typeof tryResumeSession === 'function') tryResumeSession();
  });


</script>
</body>
</html>
