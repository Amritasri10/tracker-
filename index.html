<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AucTech Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>

<script>window.AUCTECH_API_BASE = "https://auctech-vault-backend-1.onrender.com/api";</script>

<!-- Login module (exposes authFetch, logout, etc.) -->
<script src="login.js"></script>

<body>

<!-- ============ LOCK SCREEN (loaded from lockscreen.html) ============ -->
<div id="lockScreenContainer"></div>

<!-- ============ APP ============ -->
<div id="app">
  <header class="header">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FF5C8A"/><stop offset=".6" stop-color="#DE3163"/><stop offset="1" stop-color="#C02050"/>
        </linearGradient></defs>
        <g fill="none" stroke="url(#bg2)" stroke-linecap="round">
          <path d="M32 14a18 18 0 1 1-18 18" stroke-width="5"/>
          <path d="M32 22a10 10 0 1 1-10 10" stroke-width="5"/>
          <circle cx="32" cy="32" r="4" fill="url(#bg2)" stroke="none"/>
        </g>
      </svg>
      <div class="bn">AucTech<small>Vault</small></div>
    </div>
    <div class="searchwrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="globalSearch" placeholder="Search anything — client, domain, provider, username…" oninput="doSearch(this.value)">
      <span class="kbd">Ctrl K</span>
    </div>
    <div class="hdr-acts">
      <span class="who" id="whoami"></span>
      <button class="btn btn-primary" id="addBtn" onclick="openEdit()">＋ Add</button>
      <button class="icon-btn" title="Log out" onclick="manualLogout()" style="align-self:center">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0"/></svg>
      </button>
    </div>
  </header>
  <nav class="tabs">
    <button class="tab on" data-view="dashboard" onclick="go('dashboard')">Dashboard</button>
    <button class="tab" data-view="vault"        onclick="go('vault')">Vault</button>
    <button class="tab" data-view="renewals" id="tab-renewals" onclick="go('renewals')">Renewals</button>
    <button class="tab" data-view="social"   id="tab-social"   onclick="go('social')">Social Media</button>
    <button class="tab" data-view="settings"     onclick="go('settings')">Settings</button>
  </nav>
  <main class="main" id="main"></main>
</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer"></aside>
<div id="toasts"></div>

<!-- ============ App scripts ============ -->
<script src="js/api.js"></script>
<script src="js/functions.js"></script>
<script src="js/helpers.js"></script>
<script src="js/vault.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/renewals.js"></script>
<script src="js/socialmedia.js"></script>
<script src="js/settings.js"></script>
<script src="js/navigation.js"></script>
<script src="js/role.js"></script>
<script src="js/dataloader.js"></script>
<script src="js/auth.js"></script>
<script>

/* ---------------- shared state ---------------- */
let D        = { creds: [], audit: [] }; // in-memory only
let view     = 'dashboard';
let filt     = { cat: null, client: null, q: '' };
let userRole = null; // 'main' | 'social' | 'developer' | 'secondary'

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'tmp-' + Date.now() + '-' + Math.random());
const now = () => new Date().toISOString();

/* ---------------- load lockscreen HTML ---------------- */
fetch('lockscreen.html')
  .then(r => r.text())
  .then(html => {
    document.getElementById('lockScreenContainer').innerHTML = html;
    // re-init password toggles after HTML is injected (login.js needs the DOM)
    if (typeof initPasswordToggles === 'function') initPasswordToggles();
    // if a session token exists, try to resume it now that the DOM is ready
    if (typeof tryResumeSession === 'function') tryResumeSession();
  });


</script>
</body>
</html>
